name: Automatic Production Deployment (CD)
on:
  push:
    branches: [ main ]   # No pull_request trigger - only on push to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Run security scan (simulated)
        run: |
          echo "Running security scan..."
          echo " No critical vulnerabilities found"

  deploy-to-production-automatic:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production-auto   # No approval required!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Automatic deployment to Production
        run: |
          echo "========================================="
          echo "AUTOMATIC PRODUCTION DEPLOYMENT (CD)"
          echo "========================================="
          echo "Application version: $(git rev-parse --short HEAD)"
          echo "Deployment timestamp: $(date)"
          echo ""
          echo " This deployment happened AUTOMATICALLY without human approval!"
          echo " Production deployment successful!"
          echo "========================================="
          echo ""
          echo "In a real scenario, this would deploy to:"
          echo " • Cloud servers"
          echo " • Kubernetes clusters"
          echo " • Azure Web Apps"
          echo " • Or any other production infrastructure"
      - name: Simulated health check
        run: |
          # SIMULATION ONLY: In a real CD pipeline, this would call your application's /health endpoint
          # Example real command: curl -f https://yourapp.com/health || exit 1
          echo "Running health checks..."
          echo "Health endpoint: https://yourapp.com/health (simulated)"
          # Simulate a random health check result (50% pass, 50% fail)
          if (( RANDOM % 2 == 0 )); then
            echo " Health check passed!"
            echo "Deployment to Production successful!"
          else
            echo " Simulated health check failure!"
            echo "HTTP 500 - Service Unhealthy"
            exit 1   # Exit with non-zero code to indicate failure -> triggers rollback
          fi
      - name: Post-deployment notification (simulated)
        run: |
          echo " Sending deployment notification to team..."
          echo " Subject: [AUTO] New version $(git rev-parse --short HEAD) deployed to Production"
          echo " Status: SUCCESS"